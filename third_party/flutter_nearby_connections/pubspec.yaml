name: flutter_nearby_connections
description: >-
  Vendored copy of flutter_nearby_connections 1.1.2 with a Gradle 8 compatible
  build script. See android/build.gradle for why the upstream build.gradle had
  to be replaced. The Dart and Kotlin sources are unmodified upstream.
version: 1.1.2
publish_to: none

environment:
  sdk: '>=2.12.0 <4.0.0'
  flutter: ">=1.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.nankai.flutter_nearby_connections
        pluginClass: FlutterNearbyConnectionsPlugin
      ios:
        pluginClass: FlutterNearbyConnectionsPlugin
