# Gradle JVM settings.
#
# The heap must fit the machine, not the other way round. An earlier value of
# -Xmx8G exceeded this host's total RAM (7.7 GB), so the daemon was killed
# mid-build with "Native memory allocation failed" rather than reporting a
# memory error. 3 GB leaves room for the OS, the Kotlin daemon and R8, and is
# still ample for a project this size.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# R8 shrinking a release build is the memory-hungry step. Keeping it in-process
# in the Gradle daemon avoids a second copy of the heap; if a larger project
# ever OOMs here, set this to true so R8 runs as a forked process instead.
android.enableR8.fullMode=true
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
